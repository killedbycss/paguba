<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Доступная текстовая версия дневника" />
    <meta name="theme-color" content="#ffffff" />
    <title>Доктор. Дневник — доступная версия</title>
    <link id="accessibleIcon" rel="icon" type="image/png" href="content/Icons/chapters/chapter-1.png" />
    <link rel="stylesheet" href="accessible.css?v=20261030b" />
  </head>
  <body>
    <a class="skip-link" href="#chapterText">Перейти к тексту главы</a>

    <header class="page-header">
      <a href="index.html">← Вернуться в основную версию</a>
      <p class="eyebrow">Текстовая версия</p>
      <h1>Доктор. Дневник</h1>
      <p class="lead">Восемь глав дневника: читайте в удобном темпе или слушайте озвучку.</p>
    </header>

    <main>
      <section class="reading-settings" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">Настройки чтения</h2>
        <div class="settings-row">
          <button id="decreaseText" type="button" aria-label="Уменьшить размер текста">А−</button>
          <button id="increaseText" type="button" aria-label="Увеличить размер текста">А+</button>
          <button id="toggleContrast" type="button" aria-pressed="false">Высокая контрастность</button>
        </div>
      </section>

      <nav class="chapter-navigation" aria-label="Выбор главы">
        <button id="previousChapter" type="button">← Предыдущая глава</button>
        <label for="chapterSelect">Глава</label>
        <select id="chapterSelect"></select>
        <button id="nextChapter" type="button">Следующая глава →</button>
      </nav>

      <article class="reader" aria-labelledby="chapterTitle">
        <h2 id="chapterTitle" tabindex="-1"></h2>
        <section class="narration" aria-labelledby="narrationTitle">
          <h3 id="narrationTitle">Слушать главу</h3>
          <audio id="accessibleNarration" controls preload="metadata"></audio>
        </section>
        <div class="chapter-text" id="chapterText"></div>
      </article>

      <p class="status" id="chapterStatus" role="status"></p>
    </main>

    <footer class="page-footer">
      <a href="#">К началу страницы ↑</a>
    </footer>

    <script src="content/book.js"></script>
    <script src="accessible.js?v=20261030b"></script>
  </body>
</html>
