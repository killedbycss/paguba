<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Читайте «Пагубу» в удобном формате или слушайте в озвучке." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Пагуба" />
    <meta property="og:description" content="Читайте в удобном формате или слушайте в озвучке." />
    <meta property="og:image" content="https://killedbycss.github.io/paguba/content/meta/accessible.png" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Пагуба</title>
    <link id="accessibleIcon" rel="icon" type="image/png" href="content/Icons/chapters/chapter-1.png" />
    <link rel="stylesheet" href="accessible.css?v=20261031b" />
  </head>
  <body>
    <a class="skip-link" href="#chapterText">Перейти к тексту главы</a>

    <header class="page-header">
      <a href="index.html">← Вернуться в основную версию</a>
      <h1>Пагуба</h1>
      <p class="lead">Читайте в удобном формате или слушайте в озвучке.</p>
    </header>

    <main class="page-layout">
      <aside class="reader-sidebar" aria-label="Управление чтением">
        <section class="reading-settings" aria-labelledby="settingsTitle">
          <h2 id="settingsTitle">Настройки чтения</h2>
          <div class="settings-row" aria-label="Размер текста">
            <button id="decreaseText" type="button" aria-label="Уменьшить размер текста">А−</button>
            <button id="increaseText" type="button" aria-label="Увеличить размер текста">А+</button>
          </div>
          <fieldset class="vision-modes">
            <legend>Режим зрения</legend>
            <button type="button" data-vision="light" aria-pressed="true">Светлый</button>
            <button type="button" data-vision="dark" aria-pressed="false">Тёмный</button>
            <button type="button" data-vision="contrast" aria-pressed="false">Контрастный</button>
            <button type="button" data-vision="soft" aria-pressed="false">Мягкий</button>
          </fieldset>
        </section>

        <nav class="chapter-navigation" aria-label="Выбор главы">
          <label for="chapterSelect">Глава</label>
          <select id="chapterSelect"></select>
          <div class="chapter-buttons">
            <button id="previousChapter" type="button" aria-label="Предыдущая глава">←</button>
            <button id="nextChapter" type="button" aria-label="Следующая глава">→</button>
          </div>
        </nav>
      </aside>

      <article class="reader" aria-labelledby="chapterTitle">
        <h2 id="chapterTitle" tabindex="-1"></h2>
        <section class="narration" aria-labelledby="narrationTitle">
          <h3 id="narrationTitle">Слушать главу</h3>
          <audio id="accessibleNarration" controls preload="metadata"></audio>
        </section>
        <div class="chapter-text" id="chapterText"></div>
        <div class="selection-tools" id="selectionTools" hidden>
          <button id="copySelectionLink" type="button">Скопировать ссылку на фрагмент</button>
        </div>
        <nav class="chapter-navigation chapter-navigation-bottom" aria-label="Выбор следующей главы">
          <label for="chapterSelectBottom">Глава</label>
          <select id="chapterSelectBottom"></select>
          <div class="chapter-buttons">
            <button id="previousChapterBottom" type="button" aria-label="Предыдущая глава">←</button>
            <button id="nextChapterBottom" type="button" aria-label="Следующая глава">→</button>
          </div>
        </nav>
      </article>

      <p class="status" id="chapterStatus" role="status"></p>
    </main>

    <footer class="page-footer">
      <a href="#">К началу страницы ↑</a>
    </footer>

    <script src="content/book.js"></script>
    <script src="accessible.js?v=20261031b"></script>
  </body>
</html>
